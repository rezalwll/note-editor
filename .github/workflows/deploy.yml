name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'master' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout deployed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup deploy archive script
        run: chmod +x scripts/create-deploy-archive.sh

      - name: Create deploy archive
        run: scripts/create-deploy-archive.sh "${RUNNER_TEMP}/notebook-deploy.tgz"

      - name: Setup SSH key
        shell: bash
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.PROD_SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.PROD_SSH_HOST }}" >> ~/.ssh/known_hosts
          cat > ~/.ssh/config <<'SSHCONFIG'
          Host notava-production
            HostName ${{ secrets.PROD_SSH_HOST }}
            User ${{ secrets.PROD_SSH_USER }}
            IdentityFile ~/.ssh/id_ed25519
            IdentitiesOnly yes
            ConnectTimeout 30
            ConnectionAttempts 3
            ServerAliveInterval 15
            ServerAliveCountMax 40
            TCPKeepAlive yes
          SSHCONFIG
          chmod 600 ~/.ssh/config

      - name: Upload release files
        run: |
          scp "${RUNNER_TEMP}/notebook-deploy.tgz" scripts/deploy-notebook.sh \
            notava-production:/root/

      - name: Deploy on server
        shell: bash
        run: |
          ssh notava-production \
            "chmod +x /root/deploy-notebook.sh && \
            DOMAIN='${{ secrets.PROD_DOMAIN }}' \
            DOMAIN_ALIASES='www.${{ secrets.PROD_DOMAIN }}' \
            SSL_EMAIL='${{ secrets.PROD_SSL_EMAIL }}' \
            PORT='${{ secrets.PROD_PORT }}' \
            APP_DIR='${{ secrets.PROD_APP_DIR }}' \
            VERIFY_ON_SERVER='false' \
            bash /root/deploy-notebook.sh && \
            (systemctl disable --now notebook-auto-deploy.timer >/dev/null 2>&1 || true) && \
            rm -f /etc/systemd/system/notebook-auto-deploy.service /etc/systemd/system/notebook-auto-deploy.timer && \
            systemctl daemon-reload && \
            rm -f /usr/local/bin/notebook-auto-deploy /etc/notebook-auto-deploy.env /var/lock/notebook-auto-deploy.lock && \
            rm -rf /var/lib/notebook-auto-deploy /opt/notebook-source"
