name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'master'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout deployed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup deploy archive script
        run: chmod +x scripts/create-deploy-archive.sh

      - name: Create deploy archive
        run: scripts/create-deploy-archive.sh notebook-deploy.tgz

      - name: Setup SSH key
        shell: bash
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.PROD_SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.PROD_SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload release files
        run: |
          scp notebook-deploy.tgz scripts/deploy-notebook.sh \
            "${{ secrets.PROD_SSH_USER }}@${{ secrets.PROD_SSH_HOST }}:/root/"

      - name: Deploy on server
        shell: bash
        run: |
          ssh "${{ secrets.PROD_SSH_USER }}@${{ secrets.PROD_SSH_HOST }}" \
            "chmod +x /root/deploy-notebook.sh && \
            DOMAIN='${{ secrets.PROD_DOMAIN }}' \
            SSL_EMAIL='${{ secrets.PROD_SSL_EMAIL }}' \
            PORT='${{ secrets.PROD_PORT }}' \
            APP_DIR='${{ secrets.PROD_APP_DIR }}' \
            VERIFY_ON_SERVER='false' \
            bash /root/deploy-notebook.sh"
